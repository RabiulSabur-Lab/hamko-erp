name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Compute Dynamic APK Version & Commit Changelog
        id: app_version
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const baseParts = String(pkg.version || "1.2.0").split(".");
            const major = parseInt(baseParts[0] || "1", 10);
            const minor = parseInt(baseParts[1] || "2", 10);
            const runNum = parseInt(process.env.GITHUB_RUN_NUMBER || "1", 10);
            const versionName = `${major}.${minor}.${runNum}`;
            const versionCode = (major * 10000) + (minor * 100) + runNum;
            let changelog = "• Real-time cloud sync & mobile ERP enhancements";
            try {
              changelog = execSync("git log -5 --pretty=format:\"• %s (%h)\"").toString().trim() || changelog;
            } catch {}
            const nowIso = new Date().toISOString();

            pkg.version = versionName;
            pkg.versionCode = versionCode;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            for (const targetPath of ["public/version.json", "version.json"]) {
              let vObj = {};
              if (fs.existsSync(targetPath)) {
                try { vObj = JSON.parse(fs.readFileSync(targetPath, "utf8")); } catch {}
              }
              vObj.platform = "android";
              vObj.version = versionName;
              vObj.versionCode = versionCode;
              vObj.minSupportedVersion = vObj.minSupportedVersion || "1.0.0";
              vObj.forceUpdate = Boolean(vObj.forceUpdate);
              vObj.apkUrl = vObj.apkUrl || "https://github.com/RabiulSabur-Lab/hamko-erp/releases/latest/download/app-release.apk";
              vObj.releaseNotes = changelog;
              vObj.releasedAt = nowIso;
              fs.writeFileSync(targetPath, JSON.stringify(vObj, null, 2) + "\n");
            }

            fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION_NAME=${versionName}\nAPP_VERSION_CODE=${versionCode}\n`);
            console.log(`Synced dynamic APK version: v${versionName} (code ${versionCode})`);
          '

      - name: Install npm dependencies
        run: npm install

      - name: Clean stale Vite, Capacitor, and Android build artifacts
        run: rm -rf dist android/app/src/main/assets/public android/app/build android/.gradle

      - name: TypeScript check & clean web application build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rkjelornojeooqufcuwk.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJramVsb3Jub2plb29xdWZjdXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjQ3OTYsImV4cCI6MjA5OTkwMDc5Nn0.gs4GtGqYHbparOAx-h8Ny0GXcMX5opx2_7LSIHfc0sk' }}
        run: |
          npx tsc --noEmit
          npm run build
          grep -q "3-Tier Chain Discount" dist/assets/index-*.js

      - name: Hard sync Capacitor Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          npx cap sync android --inline
          grep -q "3-Tier Chain Discount" android/app/src/main/assets/public/assets/index-*.js

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x android/gradlew

      - name: Clean & Build Android Debug APK with Dynamic Version
        run: cd android && ./gradlew clean assembleDebug -PVERSION_NAME="${APP_VERSION_NAME}" -PVERSION_CODE="${APP_VERSION_CODE}" --no-build-cache --no-daemon

      - name: Verify fresh web bundle inside APK & rename output
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Hamko-ERP.apk
          unzip -l android/app/build/outputs/apk/debug/Hamko-ERP.apk | grep "assets/public/assets/index-"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hamko-ERP.apk
          path: android/app/build/outputs/apk/debug/Hamko-ERP.apk
          if-no-files-found: error
