apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def resolveAppVersionInfo() {
    def pkgFile = file("../../package.json")
    def verFile = file("../../public/version.json")
    def pkgJson = pkgFile.exists() ? new JsonSlurper().parseText(pkgFile.getText("UTF-8")) : [:]
    def verJson = verFile.exists() ? new JsonSlurper().parseText(verFile.getText("UTF-8")) : [:]

    def propVerName = project.hasProperty("VERSION_NAME") ? project.property("VERSION_NAME")?.toString()?.trim() : null
    def envVerName = System.getenv("APP_VERSION_NAME")?.trim()
    def resolvedName = propVerName ?: envVerName ?: verJson.version?.toString()?.trim() ?: pkgJson.version?.toString()?.trim() ?: "1.2.0"

    def propVerCode = project.hasProperty("VERSION_CODE") ? project.property("VERSION_CODE")?.toString()?.trim() : null
    def envVerCode = System.getenv("APP_VERSION_CODE")?.trim()
    def resolvedCode = 120
    if (propVerCode && propVerCode.isInteger()) {
        resolvedCode = propVerCode.toInteger()
    } else if (envVerCode && envVerCode.isInteger()) {
        resolvedCode = envVerCode.toInteger()
    } else if (verJson.versionCode != null) {
        resolvedCode = (verJson.versionCode as Integer)
    } else if (pkgJson.versionCode != null) {
        resolvedCode = (pkgJson.versionCode as Integer)
    } else {
        def parts = resolvedName.replaceAll(/[^0-9.]/, "").tokenize(".")
        def major = parts.size() > 0 && parts[0].isInteger() ? parts[0].toInteger() : 1
        def minor = parts.size() > 1 && parts[1].isInteger() ? parts[1].toInteger() : 2
        def patch = parts.size() > 2 && parts[2].isInteger() ? parts[2].toInteger() : 0
        resolvedCode = (major * 10000) + (minor * 100) + patch
    }

    return [versionName: resolvedName, versionCode: Math.max(1, resolvedCode)]
}

def appVersionInfo = resolveAppVersionInfo()

android {
    namespace = "com.hamko.erp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hamko.erp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionInfo.versionCode
        versionName appVersionInfo.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
